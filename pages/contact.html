<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact – Ajeet Kumar</title>
  <link rel="stylesheet" href="../css/portfolio.css">
  <link rel="stylesheet" href="../css/main-theme.css">
  <script src="../data/portfolio.js"></script>
  <script src="../js/nav-inject.js"></script>
</head>
<body class="bg-void text-white">
  <div class="container mx-auto px-5 py-20">
    <div class="glass-card p-8 max-w-2xl mx-auto">
      <h1 class="text-4xl font-bold text-center mb-6">Let's <span class="neon-text">Connect</span></h1>
      <div id="contact-info" class="space-y-3 text-center mb-6"></div>
      <form id="contact-form" class="space-y-4">
        <input type="text" id="name" placeholder="Your Name" class="w-full bg-black/30 border border-white/20 rounded-lg px-4 py-2" required>
        <input type="email" id="email" placeholder="Your Email" class="w-full bg-black/30 border border-white/20 rounded-lg px-4 py-2" required>
        <textarea id="message" rows="4" placeholder="Your Message" class="w-full bg-black/30 border border-white/20 rounded-lg px-4 py-2" required></textarea>
        <button type="submit" class="btn-primary w-full">Send Message</button>
      </form>
      <div id="form-status" class="mt-4 text-center text-sm hidden"></div>
    </div>
  </div>
  <script>
    const p = PORTFOLIO_DATA.personal;
    document.getElementById('contact-info').innerHTML = `
      <p><i class="fas fa-envelope text-accent"></i> ${p.email}</p>
      <p><i class="fas fa-phone text-accent"></i> ${p.phone}</p>
      <p><i class="fas fa-map-marker-alt text-accent"></i> ${p.location}</p>
      <div class="flex justify-center gap-4">
        <a href="${p.linkedin}" target="_blank" class="text-accent2"><i class="fab fa-linkedin text-2xl"></i></a>
        <a href="${p.github}" target="_blank" class="text-accent2"><i class="fab fa-github text-2xl"></i></a>
        <a href="${p.leetcode}" target="_blank" class="text-accent2"><i class="fab fa-leetcode text-2xl"></i></a>
      </div>
    `;
    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('form-status');
      status.classList.remove('hidden');
      status.innerHTML = '<div class="spinner mx-auto"></div> Sending...';
      // Simulate email sending (replace with EmailJS or your backend)
      setTimeout(() => {
        status.innerHTML = '<span class="text-accent">✓ Message sent! Ajeet will reply soon.</span>';
        document.getElementById('contact-form').reset();
        setTimeout(() => status.classList.add('hidden'), 5000);
      }, 1000);
    });
  </script>
</body>
</html>

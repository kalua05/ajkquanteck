<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Certifications – Ajeet Kumar</title>
  <link rel="stylesheet" href="../css/portfolio.css">
  <link rel="stylesheet" href="../css/main-theme.css">
  <script src="../data/portfolio.js"></script>
  <script src="../js/nav-inject.js"></script>
</head>
<body class="bg-void text-white">
  <div class="container mx-auto px-5 py-20">
    <h1 class="text-4xl font-bold text-center mb-4">Certifications & <span class="neon-text">Awards</span></h1>
    <div id="cert-filter" class="flex flex-wrap gap-2 justify-center mb-6"></div>
    <div id="cert-list" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </div>
  <script>
    const allCerts = loadData('certifications');
    const categories = [...new Set(allCerts.map(c => c.cat))];
    let activeCat = 'all';
    function render() {
      const filtered = activeCat === 'all' ? allCerts : allCerts.filter(c => c.cat === activeCat);
      document.getElementById('cert-list').innerHTML = filtered.map(cert => `
        <div class="glass-card p-5">
          <div class="flex items-center gap-2 mb-2"><span class="text-accent text-xl">📜</span><span class="text-muted text-xs">${cert.issuer}</span></div>
          <h4 class="font-semibold">${cert.name}</h4>
          <p class="text-xs text-muted mt-1">${cert.date}</p>
        </div>
      `).join('');
    }
    const filterDiv = document.getElementById('cert-filter');
    filterDiv.innerHTML = `<button onclick="setCat('all')" class="btn-outline text-sm ${activeCat==='all'?'bg-accent/20':''}">All</button>` + categories.map(cat => `<button onclick="setCat('${cat}')" class="btn-outline text-sm">${cat}</button>`).join('');
    window.setCat = (cat) => { activeCat = cat; render(); document.querySelectorAll('#cert-filter button').forEach(btn => btn.classList.remove('bg-accent/20')); event.target.classList.add('bg-accent/20'); };
    render();
  </script>
</body>
</html>

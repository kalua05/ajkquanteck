<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills – Ajeet Kumar</title>
  <link rel="stylesheet" href="../css/portfolio.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/main-theme.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../data/portfolio.js"></script>
  <script src="../js/nav-inject.js"></script>
</head>
<body class="bg-void text-white">
  <div class="container mx-auto px-5 py-20">
    <h1 class="text-4xl font-bold text-center mb-8">Technical <span class="neon-text">Skills</span></h1>
    <div class="glass-card p-6">
      <canvas id="radarChart" class="max-w-md mx-auto"></canvas>
      <div id="skills-grid" class="grid md:grid-cols-3 gap-6 mt-8"></div>
    </div>
  </div>
  <script>
    const skills = loadData('skills');
    const groups = [
      { key: 'quant', title: 'Quant & Portfolio Methods' },
      { key: 'libraries', title: 'Libraries & Frameworks' },
      { key: 'ml', title: 'Machine Learning' }
    ];
    const grid = document.getElementById('skills-grid');
    grid.innerHTML = groups.map(g => `
      <div class="glass-card p-5">
        <h4 class="font-bold text-accent mb-3">${g.title}</h4>
        ${skills[g.key].map(s => `
          <div class="mt-2">
            <div class="flex justify-between text-sm"><span>${s.name}</span><span>${s.level}%</span></div>
            <div class="skill-bar-bg"><div class="skill-fill" style="width:${s.level}%"></div></div>
          </div>
        `).join('')}
      </div>
    `).join('');
    // Radar chart
    const ctx = document.getElementById('radarChart').getContext('2d');
    new Chart(ctx, {
      type: 'radar',
      data: {
        labels: ['Portfolio Opt', 'Derivatives', 'Econometrics', 'ML', 'Python', 'Risk'],
        datasets: [{ data: [92, 85, 94, 87, 92, 88], borderColor: '#00f0b4', backgroundColor: 'rgba(0,240,180,0.2)' }]
      },
      options: { responsive: true, scales: { r: { ticks: { display: false } } } }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blog – Ajeet Kumar</title>
  <link rel="stylesheet" href="../css/portfolio.css">
  <link rel="stylesheet" href="../css/main-theme.css">
  <script src="../data/portfolio.js"></script>
  <script src="../js/nav-inject.js"></script>
</head>
<body class="bg-void text-white">
  <div class="container mx-auto px-5 py-20">
    <h1 class="text-4xl font-bold text-center mb-8">Blog & <span class="neon-text">Insights</span></h1>
    <div class="grid md:grid-cols-2 gap-6" id="blog-list"></div>
  </div>
  <script>
    const blogs = loadData('blog');
    document.getElementById('blog-list').innerHTML = blogs.map(blog => `
      <a href="${blog.link}" target="_blank" class="glass-card p-6 hover:scale-[1.02] transition">
        <div class="flex justify-between"><span class="tag">${blog.tag}</span><span class="text-muted text-sm">${blog.date}</span></div>
        <h3 class="text-xl font-bold mt-2">${blog.title}</h3>
        <p class="text-gray-300 mt-1">${blog.summary}</p>
        <div class="mt-3 text-accent">Read more →</div>
      </a>
    `).join('');
  </script>
</body>
</html>

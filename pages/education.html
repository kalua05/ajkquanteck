<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Education – Ajeet Kumar</title>
  <link rel="stylesheet" href="../css/portfolio.css">
  <link rel="stylesheet" href="../css/main-theme.css">
  <script src="../data/portfolio.js"></script>
  <script src="../data/modal-data.js"></script>
  <script src="../js/nav-inject.js"></script>
</head>
<body class="bg-void text-white">
  <div class="container mx-auto px-5 py-20">
    <h1 class="text-4xl font-bold mb-8">Education & Transcripts</h1>
    <div id="edu-list" class="grid md:grid-cols-3 gap-6"></div>
  </div>
  <div id="modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4" onclick="if(event.target===this) closeModal()">
    <div class="glass-card max-w-4xl w-full max-h-[85vh] overflow-auto p-6">
      <div id="modal-content"></div>
      <button onclick="closeModal()" class="mt-4 btn-outline">Close</button>
    </div>
  </div>
  <script>
    const edu = PORTFOLIO_DATA.education;
    const container = document.getElementById('edu-list');
    container.innerHTML = edu.map(e => `<div class="glass-card p-6"><div class="text-3xl">${e.flag}</div><h3 class="text-xl font-bold">${e.degree}</h3><p class="text-muted">${e.uni}<br>${e.period}</p><p class="text-accent mt-2">${e.score}</p><button onclick="showTranscript('${e.id}')" class="mt-3 btn-outline text-sm">View Full Transcript →</button></div>`).join('');
    window.showTranscript = (id) => {
      const data = MODAL_DATA[`${id}-transcript`];
      if(data) {
        document.getElementById('modal-content').innerHTML = `<div class="flex justify-between items-start mb-4"><div><span class="text-4xl">${data.icon}</span><h3 class="text-2xl font-bold">${data.title}</h3><p class="text-muted">${data.issuer}</p></div><a href="${data.dl}" download class="btn-primary text-sm">Download PDF</a></div><div class="prose prose-invert max-w-none">${data.body}</div>`;
        document.getElementById('modal').classList.remove('hidden');
      }
    };
    window.closeModal = () => document.getElementById('modal').classList.add('hidden');
  </script>
</body>
</html>

<!DOCTYPE html><html><head><title>Experience</title><link rel="stylesheet" href="../css/portfolio.css"><script src="../data/portfolio.js"></script><script src="../js/nav-inject.js"></script></head>
<body class="bg-void"><div class="container mx-auto px-5 py-20"><h1 class="text-4xl font-bold mb-8">Experience</h1><div id="exp-list" class="space-y-6"></div></div>
<script>const exp = loadData('experience'); document.getElementById('exp-list').innerHTML = exp.map(e => `<div class="glass-card p-6"><div class="text-3xl">${e.icon}</div><h3 class="text-xl font-bold">${e.role}</h3><p class="text-accent">${e.company} · ${e.location}</p><p class="text-muted text-sm">${e.period}</p><ul class="mt-2 list-disc list-inside"><li>${e.bullets.join('</li><li>')}</li></ul></div>`).join('');</script></body></html>

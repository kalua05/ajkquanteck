<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume – Ajeet Kumar</title>
  <link rel="stylesheet" href="../css/portfolio.css">
  <link rel="stylesheet" href="../css/main-theme.css">
  <script src="../data/portfolio.js"></script>
  <script src="../js/nav-inject.js"></script>
</head>
<body class="bg-void text-white">
  <div class="container mx-auto px-5 py-20">
    <div class="glass-card p-8 text-center">
      <h1 class="text-4xl font-bold mb-4">Curriculum <span class="neon-text">Vitae</span></h1>
      <a id="resume-download" class="btn-primary inline-block mb-6" download>⬇ Download PDF</a>
      <div class="w-full h-[80vh] border border-white/20 rounded-lg overflow-hidden">
        <iframe id="resume-viewer" src="" class="w-full h-full" title="Resume PDF"></iframe>
      </div>
    </div>
  </div>
  <script>
    const resumeLink = PORTFOLIO_DATA.personal.resume_link;
    document.getElementById('resume-download').href = resumeLink;
    document.getElementById('resume-viewer').src = resumeLink;
  </script>
</body>
</html>
